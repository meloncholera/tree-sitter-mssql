# =============================================================================
#  tree-sitter-mssql · GitHub Actions
# -----------------------------------------------------------------------------
#  File                fuzz.yml
#  Workflow name        Fuzz
#  Type                Entrypoint (runs in this repo only)
#  Triggers            schedule (weekly)
#                      workflow_dispatch
#  Purpose             Fuzzes the parser and src/scanner.c — the only
#                      hand-written C in an otherwise generated parser —
#                      against arbitrary and adversarial input, seeded from
#                      test/fixtures/*.sql, and fails if libFuzzer finds a
#                      panic, crash, or hang. Runs on a schedule rather than
#                      per-PR, since fuzzing has no fixed completion time
#                      and a PR gate needs one; a bug it finds is filed or
#                      fixed like any other, not blocked on a specific PR.
# =============================================================================

name: Fuzz

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC — an off-peak, arbitrary minute
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz src/scanner.c and the parser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17 (action itself publishes no version tags)
        with:
          toolchain: nightly

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed the corpus from the fixtures
        run: |
          set -euo pipefail
          mkdir -p fuzz/corpus/parse
          cp test/fixtures/*.sql fuzz/corpus/parse/

      - name: Fuzz
        run: cargo fuzz run parse -- -max_total_time=300

      - name: Upload a crashing input on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/parse/
          if-no-files-found: ignore
